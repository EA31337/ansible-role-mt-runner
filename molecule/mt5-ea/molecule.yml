---
dependency:
  command: >-
    ansible-galaxy install -r "${MOLECULE_SCENARIO_DIRECTORY}"/../requirements.yml
    && pip install -r "${MOLECULE_SCENARIO_DIRECTORY}"/../requirements.txt
  name: shell
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ansible-lint
  # flake8
platforms:
  - env:
      MT_RUNNER_MT5_LOGIN: "${MT_RUNNER_MT5_LOGIN:-12345}"
      MT_RUNNER_MT5_PASSWORD: "${MT_RUNNER_MT5_PASSWORD:-SETME}"
    groups:
      - mt5
    image: ubuntu:jammy
    name: ubuntu-jammy
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  config_options:
    defaults:
      # Use the built-in default callback with result_format instead of community.general.yaml
      stdout_callback: ansible.builtin.default
      result_format: yaml
      remote_tmp: /tmp/.ansible-tmp-$${USER}
  name: ansible
  inventory:
    group_vars:
      all:
        wine_install_winetricks: true
        wine_release: stable
verifier:
  name: ansible
