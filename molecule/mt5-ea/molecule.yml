---
dependency:
  command: >-
    ansible-galaxy install -r "${MOLECULE_SCENARIO_DIRECTORY}"/../requirements.yml
    && pip install -r "${MOLECULE_SCENARIO_DIRECTORY}"/../requirements.txt
  name: shell
driver:
  name: docker
lint: |
  set -e
  ansible-lint
  yamllint .
  # flake8
platforms:
  - env:
      MT_RUNNER_MT5_LOGIN: "${MT_RUNNER_MT5_LOGIN:-12345}"
      MT_RUNNER_MT5_PASSWORD: "${MT_RUNNER_MT5_PASSWORD:-SETME}"
    groups:
      - mt5
    image: ubuntu:jammy
    name: ubuntu-jammy
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible-tmp-$${USER}
  name: ansible
  inventory:
    group_vars:
      all:
        wine_install_winetricks: true
verifier:
  name: ansible
