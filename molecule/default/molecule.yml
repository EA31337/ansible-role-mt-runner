---
# Molecule configuration file.
# Dependency management (download roles/collections)
# Note: Keep YAML keys sorted alphabetically.
dependency:
  name: galaxy
  options:
    ignore-certs: false
    ignore-errors: false
    role-file: requirements.yml
    requirements-file: requirements.yml
driver:
  name: docker
lint: |
  set -e
  yamllint .
  molecule syntax
  ansible-lint
platforms:
  - name: alpine-latest
    image: i386/alpine:latest
    init: true
  - name: debian-latest
    image: debian:latest
    init: true
  - name: nixos-latest
    dockerfile: ../resources/playbooks/Dockerfile.j2
    image: nixos/nix:latest
    init: true
    pre_build_image: false
    privileged: true
  - env:
      MT_RUNNER_MT5_LOGIN: "${MT_RUNNER_MT5_LOGIN:-12345}"
      MT_RUNNER_MT5_PASSWORD: "${MT_RUNNER_MT5_PASSWORD:-SETME}"
      MT_RUNNER_MT5_SERVER: "${MT_RUNNER_MT5_SERVER:-MetaQuotes-Demo}"
      WINEDLLOVERRIDES: "mscoree,mshtml=,winebrowser.exe=,dbghelp=n"
    groups:
      - mt5
    image: ubuntu:jammy
    name: ubuntu-jammy
    init: true
  - name: ubuntu-noble
    image: ubuntu:noble
    init: true
  - name: ubuntu-latest
    image: ubuntu:latest
    init: true
provisioner:
  config_options:
    defaults:
      # Some molecule-docker playbooks use `when: (lookup('env', 'HOME'))` which
      # can be broken in sandboxed environments. This option allows Molecule
      # to skip those tasks instead of failing when it encounters broken conditionals
      # in its create/destroy playbooks (e.g. `when: (lookup('env', 'HOME'))`).
      # See: https://github.com/ansible-community/molecule-plugins/issues/295
      allow_broken_conditionals: true
      callbacks_enabled: ansible.posix.profile_tasks
      # Ensure collections installed to ./collections are found by ansible-playbook.
      collections_path: >-
        ${MOLECULE_PROJECT_DIRECTORY}/collections:~/.ansible/collections:/usr/share/ansible/collections
      host_key_checking: false
      # Use the built-in ansible.builtin.default callback with YAML result_format for output
      remote_tmp: /tmp/.ansible-tmp-$${USER}
      result_format: yaml
      stdout_callback: ansible.builtin.default
      verbosity: "${ANSIBLE_VERBOSITY:-2}"
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"
  inventory:
    group_vars:
      all:
        wine_install_winetricks: true
        wine_release: stable
    host_vars:
      alpine-latest:
        wine_version: '9'
      nixos-latest:
        ansible_python_interpreter: /root/.nix-profile/bin/python3
        wine_version: '9'
      ubuntu-jammy:
        wine_version: '10.0'
  ssh_connection:
    pipelining: true
  name: ansible
  options:
    diff: true
    force-handlers: true
  playbooks:
    converge: converge.yml
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    verify: verify.yml

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
