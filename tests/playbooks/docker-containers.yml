---
- name: Configure Docker container
  # Note: Since facts are not gathered, we're checking for ansible_user_id, connection_user or UID instead.
  become: >-
    {{
      (connection_user | default('root')) != 'root'
      or (ansible_user_id | default('root')) != 'root'
      or (ansible_user_uid | default(0) | int) != 0
      or (((ansible_env | default({}))['UID'] | default(0) | int) != 0)
    }}
  # Use su as become_method as sudo is not available in all containers.
  become_method: ansible.builtin.su
  gather_facts: false
  hosts: docker_containers
  pre_tasks:
    - name: Ensure container is started
      community.docker.docker_container:
        name: '{{ inventory_hostname }}'
        image: '{{ container_image }}'
        state: started
        command: sleep infinity
        privileged: true
        tmpfs: [/tmp:exec, /run:exec]
        env:
          NIX_CONFIG: sandbox = false
          TMPDIR: /tmp
      when: container_image is search("nixos")
      delegate_to: localhost
      vars:
        # Use system Python with requests installed for controller-side Docker modules.
        ansible_python_interpreter: '{{ controller_python }}'
    - name: Ensure container is started
      community.docker.docker_container:
        name: '{{ inventory_hostname }}'
        image: '{{ container_image }}'
        state: started
        command: sleep infinity
      when: not (container_image is search("nixos"))
      delegate_to: localhost
      vars:
        # Use system Python with requests installed for controller-side Docker modules.
        ansible_python_interpreter: '{{ controller_python }}'
    - name: Wait for container to be ready
      community.docker.docker_container_info:
        name: '{{ inventory_hostname }}'
      register: container_info
      until:
        - container_info is defined
        - container_info.container.State.Running | default(false) | bool
      changed_when: false
      delay: 2
      delegate_to: localhost
      retries: 10
      vars:
        # Use system Python with requests installed for controller-side Docker modules.
        ansible_python_interpreter: '{{ controller_python }}'
    - name: Install Python 3 on Alpine
      ansible.builtin.raw: |
        test -e "{{ ansible_python_interpreter }}" || (apk update && apk add --no-cache python3 py3-pip)
      changed_when: false
      when: container_image is search("alpine")
    - name: Install Python 3 on Ubuntu/Debian
      ansible.builtin.raw: |
        test -e "{{ ansible_python_interpreter }}" || (apt-get update && apt-get install -y python3 python3-pip)
      changed_when: false
      when: container_image is search("ubuntu") or container_image is search("debian")
    - name: Install Python 3 on NixOS (from host)
      ansible.builtin.shell:
        cmd: |
          docker exec {{ inventory_hostname }} /nix/var/nix/profiles/default/bin/sh -c '
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p /etc/nix
            echo "sandbox = false" > /etc/nix/nix.conf
            export NIX_CONFIG="sandbox = false"
            /nix/var/nix/profiles/default/bin/nix-env --option sandbox false -iA nixpkgs.python3
          fi'
      changed_when: false
      delegate_to: localhost
      when: container_image is search("nixos")
      vars:
        ansible_python_interpreter: '{{ controller_python }}'
    - name: Gather facts
      ansible.builtin.setup:
    - name: Install Python packages for Ubuntu/Debian
      ansible.builtin.apt:
        name: [python3, python3-pip, python3-setuptools]
        state: present
        update_cache: true
      when: container_image is search("ubuntu") or container_image is search("debian")
  tags: always
  vars:
    controller_python: '{{ ansible_playbook_python }}'
    container_image_map:
      mt-runner-on-alpine-latest: alpine:3.20
      mt-runner-on-debian-latest: debian:latest
      mt-runner-on-nixos-latest: nixos/nix
      mt-runner-on-ubuntu-jammy: ubuntu:jammy
      mt-runner-on-ubuntu-latest: ubuntu:latest
      mt-runner-on-ubuntu-noble: ubuntu:noble
    container_image: "{{ container_image_map[inventory_hostname] | default('ubuntu:latest') }}"
- name: Install ea31337.mt_runner role on all containers
  hosts: docker_containers
  become_method: ansible.builtin.su
  gather_facts: true
  tags: always
  vars:
    controller_python: '{{ ansible_playbook_python }}'
  roles:
    - role: ea31337.mt_runner
      vars:
        # noqa: var-naming[no-role-prefix]
        metatrader_version: 5
        mt_runner_bt_mt5_config:
          Common:
            Login: "{{ ansible_facts.env.MT_RUNNER_MT5_LOGIN | default('12345') }}"
            Password: "{{ ansible_facts.env.MT_RUNNER_MT5_PASSWORD | default('SETME') }}"
            Server: "{{ ansible_facts.env.MT_RUNNER_MT5_SERVER | default('MetaQuotes-Demo') }}"
          Tester:
            Deposit: 10000
            ExecutionMode: 0
            Expert: EA31337-Libre-v1.013.ex5
            FromDate: 2024.01.01
            Leverage: 1:500
            Login: "{{ ansible_facts.env.MT_RUNNER_MT5_LOGIN | default('12345') }}"
            Model: 1
            Report: report.html
            ReplaceReport: 1
            ShutdownTerminal: 1
            Symbol: EURUSD
            ToDate: 2024.01.11
        mt_runner_get_url_list:
          - dest: '{{ mt_runner_mt_path }}/MQL5/Experts'
            url: https://github.com/EA31337/EA31337-Libre/releases/download/v1.013/EA31337-Libre-v1.013.ex5
  post_tasks:
    - name: Stop Docker containers
      community.docker.docker_container:
        name: '{{ inventory_hostname }}'
        state: stopped
      delegate_to: localhost
      failed_when: false
