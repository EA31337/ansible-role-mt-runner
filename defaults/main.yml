    ProxyEnable: 0
    ProxyLogin:
    ProxyPassword:
    ProxyServer:
    ProxyType: SOCKS5
    Server: "{{ lookup('env', 'MT_RUNNER_MT5_SERVER') | default('MetaQuotes-Demo', true) }}"
  Charts:
    PrintColor: 1
    SaveDeleted: 1
