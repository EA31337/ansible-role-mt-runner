---
# GitHub Copilot cloud agent customization.
# <https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/customize-the-agent-environment>
name: Copilot Setup Steps
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .devcontainer/requirements.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .devcontainer/requirements.txt
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Clone agents
        run: git clone --depth=1 https://github.com/Cogni-AI-OU/cogni-ai-agents .github/agents
      - name: Clone instructions
        run: git clone --depth=1 https://github.com/Cogni-AI-OU/cogni-ai-agent-instructions
          .github/instructions
      - name: Clone skills
        run: git clone --depth=1 https://github.com/Cogni-AI-OU/cogni-ai-agent-skills
          .github/skills
      - uses: actions/setup-python@v6
        with:
          cache: pip
          cache-dependency-path: |
            .devcontainer/requirements.txt
            Pipfile*
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --user -r .devcontainer/requirements.txt
      - name: Ensure local bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
