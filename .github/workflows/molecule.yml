---
# Note: Keep keys and envs in alphabetical order.
name: Molecule

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths-ignore:
      - '!.github/workflows/**'
      - '**.cfg'
      - '**.md'
      - '.*'
      - LICENSE
      - Pipfile*
  push:
    paths-ignore:
      - '!.github/workflows/**'
      - '**.cfg'
      - '**.md'
      - '.*'
      - LICENSE
      - Pipfile*

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - mt4
          - mt5-ea
    steps:
      - uses: actions/checkout@v6
        with:
          path: ${{ github.repository }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            /var/cache
          key: ${{ runner.os }}-${{ matrix.scenario }}-${{ hashFiles('**/requirements.txt') }}
      - uses: gofrolist/molecule-action@v2
        env:
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_STDOUT_CALLBACK: ${{ runner.debug == '1' && 'debug' || 'ansible.builtin.default' }}
          ANSIBLE_VERBOSITY: '3'
          DOCKER_API_VERSION: '1.44'
          MOLECULE_REPORT: molecule-${{ matrix.scenario }}-report.html
          MT_RUNNER_MT4_PASSWORD: ${{ secrets.MT_RUNNER_MT4_PASSWORD || 'SETME' }}
          MT_RUNNER_MT4_SERVER: ${{ secrets.MT_RUNNER_MT4_SERVER || 'MetaQuotes-Demo' }}
          MT_RUNNER_MT5_LOGIN: ${{ secrets.MT_RUNNER_MT5_LOGIN || '12345' }}
          MT_RUNNER_MT5_SERVER: ${{ secrets.MT_RUNNER_MT5_SERVER || 'MetaQuotes-Demo' }}
        with:
          molecule_args: >-
            --scenario-name ${{ matrix.scenario }}
          molecule_command: test
          molecule_options: --verbose
          molecule_working_dir: ${{ github.repository }}
      - if: always()
        name: Ensure report file permissions are correct
        run: |
          sudo touch molecule-${{ matrix.scenario }}-report.html
          sudo chmod 644 molecule-${{ matrix.scenario }}-report.html
        working-directory: ${{ github.repository }}
      - if: always()
        name: Converts test report
        uses: patrick-werner/fhir-html-validation-to-markdown@1.0.0
        with:
          input_file: ${{ github.repository }}/molecule-${{ matrix.scenario }}-report.html
      # Debug with tmate on failure when debug logging is enabled.
      - if: ${{ failure() && runner.debug == '1' }}
        uses: mxschmitt/action-tmate@v3
    timeout-minutes: 60
