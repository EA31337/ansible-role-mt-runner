---
# See: <https://opencode.ai/docs>
name: Cogni AI Agent
# yamllint disable-line rule:truthy
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened]
  pull_request_review_comment:
    types: [created]
  workflow_call:
    inputs:
      agent:
        default: cogni-ai-architect
        description: Agent to use.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      agent:
        default: cogni-ai-architect
        description: Agent to use.
        options:
          - cogni-ai-architect
          - cogni-ai-brain-ops
          - cogni-ai-code-reviewer
          - cogni-ai-devops
          - cogni-ai-manager
          - cogni-ai-plan-reviewer
          - default
        required: false
        type: choice
      model:
        default: opencode/gemini-3-flash
        description: Model to use for OpenCode
        options:
          - opencode/big-pickle
          - opencode/claude-3-5-haiku
          - opencode/claude-haiku-4-5
          - opencode/claude-opus-4-5
          - opencode/claude-opus-4-6
          - opencode/claude-sonnet-4
          - opencode/claude-sonnet-4-5
          - opencode/claude-sonnet-4-6
          - opencode/gemini-3.1-pro
          - opencode/gemini-3-flash
          - opencode/glm-5
          - opencode/glm-5.1
          - opencode/gpt-5
          - opencode/gpt-5-codex
          - opencode/gpt-5-nano
          - opencode/gpt-5.3-codex
          - opencode/gpt-5.3-codex-spark
          - opencode/gpt-5.4
          - opencode/gpt-5.4-mini
          - opencode/gpt-5.4-nano
          - opencode/minimax-m2.5
          - opencode/minimax-m2.5-free
          - opencode/nemotron-3-super-free
          - opencode/qwen3-coder
          - opencode/qwen3.6-plus-free
        required: true
        type: choice
      prompt:
        description: Prompt for the agent
        required: true
        type: string
jobs:
  cogni-ai-agent:
    name: Run Cogni AI agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false  # Prevents Duplicate header: "Authorization" error.
      - uses: actions/setup-python@v6
        with:
          cache: pip
          cache-dependency-path: |
            .devcontainer/requirements.txt
            Pipfile*
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --user -r .devcontainer/requirements.txt
      - name: Ensure local bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run Cogni AI Agent
        uses: Cogni-AI-OU/cogni-ai-agent-action@main
        with:
          agent: ${{ inputs.agent || 'cogni-ai-architect' }}
          model: ${{ inputs.model || 'opencode/gemini-3-flash' }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}  # <https://opencode.ai/auth>
          permissions: |-
            bash:
              '*': deny
              ansible*: allow
              ansible-galaxy*: allow
              ansible-lint*: allow
              ansible-playbook*: allow
              awk*: allow
              cat*: allow
              continue*: allow
              cp*: allow
              docker*: allow
              ex*: allow
              gh*: allow
              gh pr review*: allow
              git*: allow
              grep*: allow
              head*: allow
              hexdump*: allow
              jq*: allow
              links*: allow
              ls*: allow
              mawk*: allow
              molecule*: allow
              pipx*: allow
              pre-commit*: allow
              printf*: allow
              sed*: allow
              set*: allow
              time*: allow
              timeout*: allow
              touch*: allow
              true*: allow
              vim*: allow
          prompt: >-
            ${{ github.event.comment.body
            || github.event.issue.body
            || github.event.pull_request.body
            || inputs.prompt }}
  cogni-ai-summary:
    name: Generate Session Summary
    runs-on: ubuntu-latest
    needs: cogni-ai-agent
    if: always()
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate Session Summary
        uses: Cogni-AI-OU/cogni-ai-agent-action/ai-inference/summary@main
        with:
          agent_job_id: cogni-ai-agent
          github_token: ${{ secrets.GITHUB_TOKEN }}
