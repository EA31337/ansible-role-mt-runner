---
name: Test
# yamllint disable-line rule:truthy
on:
  pull_request:
    paths-ignore:
      - .devcontainer/**
      - .github/*.json
      - .github/dependabot.yml
      - .github/workflows/check.yml
      - .github/workflows/cogni-ai-agent.yml
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/galaxy-publish.yml
      - .github/workflows/molecule.yml
      - '**.cfg'
      - '**.md'
      - .*
      - LICENSE
      - Pipfile*
      - molecule/**
  push:
    paths-ignore:
      - .devcontainer/**
      - .github/*.json
      - .github/dependabot.yml
      - .github/workflows/check.yml
      - .github/workflows/cogni-ai-agent.yml
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/galaxy-publish.yml
      - .github/workflows/molecule.yml
      - '**.cfg'
      - '**.md'
      - .*
      - LICENSE
      - Pipfile*
      - molecule/**
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: ${{ github.repository }}
      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'
      - name: Install Python's requirements
        run: pip install -r .devcontainer/requirements.txt
        working-directory: ${{ github.repository }}
      - name: Cache Ansible Galaxy collections
        uses: actions/cache@v5
        with:
          key: galaxy-${{ hashFiles(format('{0}/requirements.yml', github.repository)) }}
          path: |
            ~/.ansible/roles
            ~/.ansible/collections
      - name: Install Ansible Galaxy requirements
        run: ansible-galaxy install -r requirements.yml
        working-directory: ${{ github.repository }}
      - name: Install Ansible Galaxy local requirements
        run: |
          jinja2 requirements-local.yml.j2 -D "pwd=$PWD" -o requirements-local.yml
          ansible-galaxy install -r requirements-local.yml && rm requirements-local.yml
        working-directory: ${{ github.repository }}
      - name: Check Ansible syntax
        run: >-
          ansible-playbook --syntax-check
          -i tests/inventory/docker-containers.yml tests/playbooks/docker-containers.yml
          --verbose
        working-directory: ${{ github.repository }}
      - name: Run Ansible lint
        run: ansible-lint tests/playbooks/docker-containers.yml
        working-directory: ${{ github.repository }}
      - name: Run Ansible playbook
        env:
          MT_RUNNER_MT5_LOGIN: ${{ secrets.MT_RUNNER_MT5_LOGIN || '12345' }}
          MT_RUNNER_MT5_PASSWORD: ${{ secrets.MT_RUNNER_MT5_PASSWORD || 'SETME' }}
          MT_RUNNER_MT5_SERVER: ${{ secrets.MT_RUNNER_MT5_SERVER || 'MetaQuotes-Demo' }}
        run: |
          ansible-playbook -i tests/inventory/docker-containers.yml tests/playbooks/docker-containers.yml -vvv
        working-directory: ${{ github.repository }}

      # Debug with tmate on failure when debug logging is enabled.
      - if: ${{ failure() && runner.debug == '1' }}
        uses: mxschmitt/action-tmate@v3
    timeout-minutes: 60
