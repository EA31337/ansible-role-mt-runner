---
- name: Check platform (non-Windows)
  when: ansible_facts.os_family != "Windows"
  block:
    - name: Install winbind package (Debian/Ubuntu)
      ansible.builtin.apt:
        allow_unauthenticated: true
        install_recommends: "{{ 'yes' if wine_install_recommends else 'no' }}"
        name: [winbind]
        state: present
        update_cache: true
      become: true
      no_log: '{{ mt_runner_no_log | default(ansible_verbosity | default(0) < 1) }}'
      when: ansible_facts.os_family == "Debian"
    - name: Query MT platform path
      changed_when: false
      ansible.builtin.find:
        paths: "{{ ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root') }}/.wine"
        patterns: >-
          {{ (mt_runner_mt_files[mt_runner_mt_version | int] | default(mt_runner_mt_files[5])).terminal }}
        recurse: true
      register: mt_path_terminal

    - name: Set platform's directory path
      ansible.builtin.set_fact:
        mt_runner_mt_path: |-
          {{ (mt_path_terminal.files | first | default({'path': '/tmp/terminal.exe'})).path | dirname }}
    - name: Set platform's terminal filepath
      ansible.builtin.set_fact:
        mt_runner_mt_terminal_path: |-
          {{ (mt_path_terminal.files | first | default({'path': '/tmp/terminal.exe'})).path }}
- name: Check fontconfig config availability (non-Windows)
  when: ansible_facts.os_family != "Windows"
  ansible.builtin.stat:
    path: |-
      {{ ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root') ~
         '/.config/fontconfig/fonts.conf' }}
  register: mt_runner_fontconfig_stat
- name: Convert paths (non-Windows)
  when: ansible_facts.os_family != "Windows"
  block:

    - name: Converts platform's path to a Unix
      changed_when: false
      # noqa command-instead-of-shell
      ansible.builtin.command: >-
        winepath {{ mt_runner_mt_path | quote }}
      environment:
        DISPLAY: '{{ xvfb_display }}'
        FONTCONFIG_FILE: |-
          {{ (ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root') ~
             '/.config/fontconfig/fonts.conf')
             if mt_runner_fontconfig_stat.stat.exists | default(false) else omit
          }}
        FONTCONFIG_PATH: |-
          {{ (ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root') ~
             '/.config/fontconfig')
             if mt_runner_fontconfig_stat.stat.exists | default(false) else omit
          }}
        WINEDEBUG: -all,fixme-all
      register: cmd_winepath_mt_path

    - name: Converts platform's path to a Windows
      changed_when: false
      # noqa command-instead-of-shell
      ansible.builtin.command: >-
        winepath -w {{ mt_runner_mt_path | quote }}
      environment:
        DISPLAY: "{{ xvfb_display }}"
        WINEDEBUG: -all,fixme-all
      register: cmd_winepath_mt_path_win

    - name: Converts platform's terminal path to a Unix
      changed_when: false
      # noqa command-instead-of-shell
      ansible.builtin.command: >-
        winepath {{ mt_runner_mt_terminal_path | quote }}
      environment:
        DISPLAY: '{{ xvfb_display }}'
        FONTCONFIG_FILE: |-
          {{ (ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root') ~
             '/.config/fontconfig/fonts.conf')
             if mt_runner_fontconfig_stat.stat.exists | default(false) else omit
          }}
        FONTCONFIG_PATH: |-
          {{ (ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root') ~
             '/.config/fontconfig')
             if mt_runner_fontconfig_stat.stat.exists | default(false) else omit
          }}
        WINEDEBUG: -all,fixme-all
      register: cmd_winepath_mt_terminal_path

    - name: Set MT platform path for Unix
      ansible.builtin.set_fact:
        mt_runner_mt_path: '{{ cmd_winepath_mt_path.stdout }}'
    - name: Set MT platform path for Windows
      ansible.builtin.set_fact:
        mt_runner_mt_path_win: '{{ cmd_winepath_mt_path_win.stdout }}'
    - name: Set MT platform's terminal path for Unix
      ansible.builtin.set_fact:
        mt_runner_mt_terminal_path: '{{ cmd_winepath_mt_terminal_path.stdout }}'
- name: Creates tester.ini
  ansible.builtin.template:
    dest: '{{ mt_runner_mt_path }}/tester.ini'
    mode: '0644'
    src: '{{ mt_runner_mt_version }}/tester.ini.j2'
  no_log: '{{ mt_runner_no_log }}'
- name: Clean-up before the test (non-Windows)
  when: ansible_facts.os_family != "Windows"
  block:
    - name: Kills any existing terminal processes
      ansible.builtin.command: pkill terminal
      changed_when: false
      failed_when: cmd_pkill_res.rc > 1
      register: cmd_pkill_res
    - name: Finds old logs
      changed_when: false
      ansible.builtin.find:
        paths: '{{ mt_runner_mt_path }}'
        patterns: '*.log'
        recurse: true
      register: mt_old_logs
    - name: Removes old log files
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: absent
      loop: '{{ mt_old_logs.files }}'
      tags: [molecule-idempotence-notest]
- name: Ensures specified files are present
  block:
    - name: Ensures destination directories are present
      ansible.builtin.file:
        mode: '0755'
        path: '{{ item.dest }}'
        state: directory
      loop: '{{ mt_runner_get_url_list }}'
    - name: Ensures files are present
      ansible.builtin.get_url:
        dest: '{{ item.dest }}'
        mode: "{{ item.mode | default('u=rw,g=r') }}"
        url: '{{ item.url }}'
      loop: '{{ mt_runner_get_url_list }}'
- name: Runs terminal
  when: mt_runner_run_terminal | bool
  async: '{{ mt_runner_timeout }}'
  poll: 0
  changed_when: false
  ansible.builtin.command:
    argv:
      - '{{ mt_runner_cmd_prefix }}'
      - '{{ mt_runner_mt_terminal_path }}'
      - /portable
      - "{{ '/config:tester.ini' if (mt_runner_mt_version | int) == 5 else 'tester.ini' }}"
  args:
    chdir: '{{ mt_runner_mt_path }}'
  environment:
    DISPLAY: '{{ xvfb_display }}'
    FONTCONFIG_FILE: >-
      {{ (ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root')
      ~ '/.config/fontconfig/fonts.conf')
         if mt_runner_fontconfig_stat.stat.exists | default(false) else omit }}
    FONTCONFIG_PATH: >-
      {{ (ansible_facts.env.HOME | default(lookup('env', 'HOME')) | default('/root')
      ~ '/.config/fontconfig')
         if mt_runner_fontconfig_stat.stat.exists | default(false) else omit }}
    WINEDEBUG: warn-all,fixme-all,-alsa,-ole,-toolbar
    WINEDLLOVERRIDES: "mshtml="
  register: cmd_terminal_async
- name: Check for terminal log
  when: mt_runner_run_terminal | bool
  block:
    - name: Wait for the terminal log file to be created
      ansible.builtin.wait_for:
        delay: 30
        path: |-
          {{ mt_runner_mt_path ~ '/logs/' ~ ('%Y%m%d' |
             strftime(ansible_facts.date_time.epoch | default(lookup('pipe', 'date +%s')) | int)) }}.log
        sleep: 10
        state: present
        timeout: 240
      register: task_wait_for_terminal_logs
    - name: Prints terminal log file
      ansible.builtin.command:
        cmd: >-
          {% if (mt_runner_mt_version | int) == 5 %}
          iconv -f utf-16 -t utf-8
          {% else %}
          cat
          {% endif %}
          "{{ task_wait_for_terminal_logs.path }}"
      changed_when: false
      failed_when:
        - res_terminal_logs.rc is defined
        - res_terminal_logs.rc != 0 or (res_terminal_logs.stderr | default('') | length > 0)
      register: res_terminal_logs
    - name: Capture terminal errors
      ansible.builtin.set_fact:
        terminal_errors: >-
          {{ (res_terminal_logs.stdout | default([]) | join('')
          | regex_search(mt_runner_terminal_errors_regex)) | default([]) }}
    - name: Checks for errors in the terminal log
      ansible.builtin.fail:
        msg: |
          Error found in terminal log file: {{ task_wait_for_terminal_logs.path }}
          Error: {{ terminal_errors }}
      when: terminal_errors | default([]) | length > 0
- name: Wait for test results
  when: mt_runner_run_terminal | bool
  block:
    - name: Wait until terminal exits
      ansible.builtin.async_status:
        jid: '{{ cmd_terminal_async.ansible_job_id }}'
      changed_when: false
      delay: 10  # How much time to wait between retries.
      register: cmd_terminal_async_status
      until: cmd_terminal_async_status is finished
      retries: '{{ mt_runner_timeout // 10 }}'
  always:
    - name: Prints final terminal log file
      ansible.builtin.command:
        cmd: >-
          {% if (mt_runner_mt_version | int) == 5 %}
          iconv -f utf-16 -t utf-8
          {% else %}
          cat
          {% endif %}
          "{{ task_wait_for_terminal_logs.path }}"
      changed_when: false
      failed_when:
        - res_terminal_logs.rc is defined
        - res_terminal_logs.rc != 0 or (res_terminal_logs.stderr | default('') | length > 0)
      register: res_terminal_logs
      when: task_wait_for_terminal_logs.path is defined
    - name: Capture terminal errors
      ansible.builtin.set_fact:
        terminal_errors: >-
          {{ (res_terminal_logs.stdout | default([]) | join('')
          | regex_search(mt_runner_terminal_errors_regex)) | default([]) }}
      when: task_wait_for_terminal_logs.path is defined
    - name: Checks for errors in the terminal log
      ansible.builtin.fail:
        msg: |
          Error found in terminal log file: {{ task_wait_for_terminal_logs.path }}
          Error: {{ terminal_errors }}
      when:
        - task_wait_for_terminal_logs.path is defined
        - terminal_errors | default([]) | length > 0

- name: Process test results
  when: cmd_terminal_async_status is finished
  block:
    - name: Store temporary report path in the mt_report_temp_path variable
      ansible.builtin.set_fact:
        mt_report_temp_path: "{{ ansible_env.TMPDIR | default('/tmp') }}/mt5_report.html"

    - name: Store temporary optimization report path in the mt_opt_report_temp_path variable
      ansible.builtin.set_fact:
        mt_opt_report_temp_path: "{{ ansible_env.TMPDIR | default('/tmp') }}/mt5_opt_report.html"

    - name: Fetch the report file to control node
      ansible.builtin.fetch:
        src: "{{ mt_runner_mt_path }}/report.html"
        dest: "{{ mt_report_temp_path }}"
        flat: true

    # TODO: Generate optimization report remove failed_when and changed_when.
    - name: Fetch the optimization report file to control node
      ansible.builtin.fetch:
        src: "{{ mt_runner_mt_path }}/optimization.html"
        dest: "{{ mt_opt_report_temp_path }}"
        flat: true
      failed_when: false
      changed_when: false

    - name: Converts report to CSV (Orders)
      ansible.builtin.copy:
        content: |
          {{ lookup('parse_mt_report', mt_report_temp_path, 'orders', True) }}
        dest: >-
          {{ mt_runner_mt_path ~ '/' ~ mt_runner_bt_mt5_config.Tester.Report }}-Orders.csv
        mode: '0644'

    - name: Converts report to CSV (Deals)
      ansible.builtin.copy:
        content: |
          {{ lookup('parse_mt_report', mt_report_temp_path, 'deals', True) }}
        dest: >-
          {{ mt_runner_mt_path ~ '/' ~ mt_runner_bt_mt5_config.Tester.Report }}-Deals.csv
        mode: '0644'

    - name: Converts report to JSON (Header)
      ansible.builtin.copy:
        content: |
          {{ lookup('parse_mt_report', mt_report_temp_path, 'header', True) }}
        dest: >-
          {{ mt_runner_mt_path ~ '/' ~ mt_runner_bt_mt5_config.Tester.Report }}-Header.json
        mode: '0644'

    # - name: Converts report to CSV (Optimization)
    #   ansible.builtin.copy:
    #     content: |
    #       {{ lookup('parse_mt_report', mt_opt_report_temp_path, 'opt', True) }}
    #     dest: >-
    #       {{ mt_runner_mt_path ~ '/' ~ mt_runner_bt_mt5_config.Tester.Report }}-Optimization.csv
    #     mode: '0644'

- name: Make sure all handlers run
  ansible.builtin.meta: flush_handlers
